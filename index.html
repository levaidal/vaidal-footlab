'use strict';
const FIELD=[['Técnica',[['control','Control de balón'],['regate','Regate'],['pase','Pase'],['vision','Visión de juego']]],['Remate',[['definicion','Definición'],['cabezazo','Cabezazo'],['tiroLejano','Tiro lejano'],['potenciaTiro','Potencia de tiro']]],['Físico',[['fuerza','Fuerza'],['resistencia','Resistencia'],['salto','Salto'],['equilibrio','Equilibrio']]],['Defensa',[['marcaje','Marcaje'],['intercepciones','Intercepciones'],['entradas','Entradas']]],['Velocidad',[['aceleracion','Aceleración'],['velocidad','Velocidad punta'],['agilidad','Agilidad']]],['Mental',[['tactica','Inteligencia táctica'],['compostura','Compostura']]]];

const KEY='footballLab.database.v1';const copy=x=>JSON.parse(JSON.stringify(x));const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=x=>Number.isInteger(x)?String(x):x.toFixed(1).replace('.',',');const uid=()=>globalThis.crypto?.randomUUID?.()||'id-'+Date.now()+'-'+Math.random().toString(36).slice(2);const keys=p=>(p==='POR'?GK:FIELD).flatMap(g=>g[1].map(a=>a[0]));const sum=a=>a.reduce((s,x)=>s+x,0);const emptyDB=()=>({schemaVersion:1,ligas:[],clubes:[],jugadores:[]});
function mk(id,nombre,posicion,equipo,vals,nacionalidad='',pie='',posicionesSecundarias=[]){return {id,nombre,posicion,equipo,nacionalidad,fechaNacimiento:'',pie,posicionesSecundarias,atributos:Object.fromEntries(keys(posicion).map((k,i)=>[k,vals[i]])),rasgos:[]}}
const DEMO={schemaVersion:1,ligas:[{id:'laliga',nombre:'Liga española (muestra)',pais:'España'},{id:'bundesliga',nombre:'Liga alemana (muestra)',pais:'Alemania'}],clubes:[{id:'real_madrid',nombre:'Real Madrid',liga:'laliga',pais:'España'},{id:'barcelona',nombre:'FC Barcelona',liga:'laliga',pais:'España'},{id:'real_betis',nombre:'Real Betis',liga:'laliga',pais:'España'},{id:'bayern',nombre:'Bayern Múnich',liga:'bundesliga',pais:'Alemania'}],jugadores:[mk('bellingham','Jude Bellingham','MC','real_madrid',[10,8,8,8,8,8,6,8,8,10,8,8,6,6,8,6,8,8,10,10],'Inglaterra','Derecho',['MCO']),mk('lamine','Lamine Yamal','ED','barcelona',[10,10,8,10,8,2,10,8,4,6,2,10,2,2,4,10,8,10,8,10],'España','Izquierdo'),mk('natan','Natan','DFC','real_betis',[6,4,6,5,2,7,4,6,8,8,8,7,8,7,8,6,7,5,7,7],'Brasil','Izquierdo',['LI']),mk('mbappe','Kylian Mbappé','DC','real_madrid',[10,10,8,8,10,4,8,10,8,8,6,8,2,2,2,10,10,10,8,10],'Francia','Derecho',['EI']),mk('raphinha','Raphinha','DC','barcelona',[9,8,9,9,9,6,8,9,6,9,5,8,5,6,6,9,9,8,9,9],'Brasil','Izquierdo',['ED','EI']),mk('pedri','Pedri','MC','barcelona',[10,9,9,10,6,3,7,7,4,8,4,9,7,8,7,7,6,9,10,10],'España','Derecho',['MCO']),mk('olise','Michael Olise','ED','bayern',[9,10,9,9,8,4,9,9,6,7,5,9,4,5,4,9,8,10,8,9],'Francia','Izquierdo',['MCO']),mk('courtois','Thibaut Courtois','POR','real_madrid',[10,10,9,10,9,9,7,9,10,9],'Bélgica','Izquierdo'),mk('neuer_prime','Manuel Neuer (prime)','POR','',[10,9,9,9,9,10,10,9,9,10],'Alemania','Derecho'),mk('casillas_prime','Iker Casillas (prime)','POR','',[10,10,8,9,7,10,6,9,10,9],'España','Izquierdo')]};
function groups(p){return p.posicion==='POR'?GK:FIELD}function groupVals(p){return groups(p).map(g=>sum(g[1].map(([k])=>p.atributos[k]))/g[1].length*10)}function globalRating(p){return sum(Object.values(p.atributos))/(p.posicion==='POR'?1:2)}function rating(p,pos=p.posicion){if(p.posicion==='POR')return pos==='POR'?globalRating(p):null;if(!W[pos])return null;return sum(groupVals(p).map((v,i)=>v*W[pos][i]/100))}function badge(v){return `<span class="rating ${v>=85?'high':''}">${v==null?'—':Math.round(v)}</span>`}
function requireStr(v,label,optional=false){if(typeof v!=='string'||(!optional&&!v.trim()))throw Error(label+': debe ser texto'+(optional?'':' no vacío'));return v.trim()}
function arr(v,label){if(!Array.isArray(v))throw Error(label+': debe ser una lista');return v}
function obj(v,label){if(!v||typeof v!=='object'||Array.isArray(v))throw Error(label+': debe ser un objeto');return v}
function normalized(raw){if(Array.isArray(raw))raw={jugadores:raw};else if(raw&&raw.atributos)raw={jugadores:[raw]};obj(raw,'Archivo');if(raw.schemaVersion!==undefined&&raw.schemaVersion!==1)throw Error('Versión de esquema no compatible: '+raw.schemaVersion);if(!['ligas','clubes','jugadores'].some(k=>Object.hasOwn(raw,k)))throw Error('No se encontró ninguna lista de ligas, clubes o jugadores.');const d=emptyDB();for(const k of ['ligas','clubes','jugadores']){const a=raw[k]===undefined?[]:arr(raw[k],k);const ids=new Set();d[k]=a.map((x,i)=>{const l=`${k}[${i}]`;obj(x,l);const id=requireStr(x.id,l+'.id');if(ids.has(id))throw Error(`${l}: ID duplicado (${id})`);ids.add(id);const nombre=requireStr(x.nombre,l+'.nombre');if(k==='ligas')return {id,nombre,pais:requireStr(x.pais??'',l+'.pais',true)};if(k==='clubes')return {id,nombre,liga:requireStr(x.liga??'',l+'.liga',true),pais:requireStr(x.pais??'',l+'.pais',true)};const posicion=requireStr(x.posicion,l+'.posicion').toUpperCase();if(!POS.includes(posicion))throw Error(l+': posición inválida '+posicion);const attrs=obj(x.atributos,l+'.atributos');const expected=keys(posicion);for(const a of expected)if(!Number.isInteger(attrs[a])||attrs[a]<0||attrs[a]>10)throw Error(`${l} (${nombre}): ${a} debe ser un entero de 0 a 10`);for(const a of Object.keys(attrs))if(!expected.includes(a))throw Error(`${l} (${nombre}): atributo desconocido ${a}`);const sec=arr(x.posicionesSecundarias??[],l+'.posicionesSecundarias').map(v=>requireStr(v,l+'.posición secundaria').toUpperCase());if(sec.some(v=>!POS.includes(v)||((v==='POR')!==(posicion==='POR'))))throw Error(l+': posición secundaria incompatible');const pie=requireStr(x.pie??'',l+'.pie',true);if(!FEET.includes(pie))throw Error(l+': pie inválido');const fechaNacimiento=requireStr(x.fechaNacimiento??'',l+'.fechaNacimiento',true);if(fechaNacimiento&&(!/^\d{4}-\d{2}-\d{2}$/.test(fechaNacimiento)||!Number.isFinite(Date.parse(fechaNacimiento))||new Date(fechaNacimiento).toISOString().slice(0,10)!==fechaNacimiento))throw Error(l+': fechaNacimiento inválida');return {id,nombre,posicion,equipo:requireStr(x.equipo??'',l+'.equipo',true),nacionalidad:requireStr(x.nacionalidad??'',l+'.nacionalidad',true),fechaNacimiento,pie,posicionesSecundarias:[...new Set(sec.filter(v=>v!==posicion))],atributos:Object.fromEntries(expected.map(a=>[a,attrs[a]])),rasgos:arr(x.rasgos??[],l+'.rasgos').map(v=>requireStr(v,l+'.rasgo'))}})}return d}
function refs(d){const c=new Set(d.clubes.map(x=>x.id)),l=new Set(d.ligas.map(x=>x.id));for(const x of d.clubes)if(x.liga&&!l.has(x.liga))throw Error(`Club ${x.nombre}: liga desconocida (${x.liga}). Inclúyela en el archivo o créala antes.`);for(const p of d.jugadores)if(p.equipo&&!c.has(p.equipo))throw Error(`Jugador ${p.nombre}: club desconocido (${p.equipo}). Inclúyelo en el archivo o créalo antes.`);return d}
function mergeDB(base,inc,mode){if(mode==='replace')return refs(copy(inc));const out=emptyDB();for(const k of ['ligas','clubes','jugadores']){const m=new Map(base[k].map(x=>[x.id,x]));for(const x of inc[k])if(mode==='update'||!m.has(x.id))m.set(x.id,x);out[k]=[...m.values()]}return refs(out)}
let db,loadError='';try{const saved=localStorage.getItem(KEY);db=saved?refs(normalized(JSON.parse(saved))):copy(DEMO)}catch(e){db=copy(DEMO);loadError='No se pudo leer el guardado local: '+e.message+'. Se muestran los ejemplos; importa una copia si tienes una.'}function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));document.querySelector('#storage').textContent='Guardado local activo';return true}catch(e){document.querySelector('#storage').textContent='Sin guardado local: exporta JSON';return false}}
let page='players', selected=db.jugadores[0]?.id||'', draft=null, dirty=false, filters={q:'',club:'*',pos:'*'},sort={key:'rating',desc:true},clubTab='clubs',clubSelected='',leagueSelected='',compA='',compB='',pending=null,importMode='merge',importError='',toastTimer;const $=s=>document.querySelector(s);function toast(msg){const e=$('#toast');e.textContent=msg;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,3600)}function savedToast(msg){toast(msg+(persist()?'':' · No se pudo guardar localmente; exporta JSON.'))}function leaveDraft(){return !dirty||confirm('Hay cambios sin guardar. ¿Descartarlos?')}function clubName(id){return db.clubes.find(c=>c.id===id)?.nombre||'Sin club'}function leagueName(id){return db.ligas.find(c=>c.id===id)?.nombre||'Sin liga'}function option(v,t,sel){return `<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(t)}</option>`}function clubOpts(v,all=false){return (all?option('*','Todos los clubes',v):'')+option('','Sin club',v)+db.clubes.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(c=>option(c.id,c.nombre,v)).join('')}function posOpts(v,all=false){return (all?option('*','Todas las pos.',v):'')+POS.map(p=>option(p,p,v)).join('')}function head(k,t,d,buttons=''){return `<div class="head"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p>${d}</p></div><div class="row">${buttons}</div></div>`}function stats(){return `<div class="stats">${[['Jugadores',db.jugadores.length],['Clubes',db.clubes.length],['Ligas',db.ligas.length],['Porteros',db.jugadores.filter(p=>p.posicion==='POR').length]].map(([k,v])=>`<div class="panel stat"><div class="eyebrow">${k}</div><strong>${v}</strong></div>`).join('')}</div>`}
